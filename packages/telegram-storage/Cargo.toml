[package]
name = "tgb-telegram-storage"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"

[lib]
name = "tgb_telegram_storage"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
mime_guess = "2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "macros"] }
parking_lot = "0.12"
futures-util = "0.3"
sha2 = "0.10"
md5 = "0.8"
hmac = "0.12"
rand = "0.8"

grammers-client = { version = "0.9", default-features = false, features = ["fs"] }
grammers-mtsender = "0.9"
grammers-session = { version = "0.9", default-features = false, features = ["serde"] }
grammers-tl-types = "0.9"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
